<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Are air pollution and rainfall in Pakistan's cities rising or falling? Monthly NASA-derived trends, 2005–2024.">
  <title>Trend Detector: Pakistan air and rain trends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="stylesheet" href="./src/css/pollution.css">
  <link rel="icon" href="./src/img/logo-64.png" type="image/png">
  <link rel="apple-touch-icon" href="./src/img/logo-192.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/home"><img src="./src/img/logo-64.png" srcset="./src/img/logo-64.png 1x, ./src/img/logo-192.png 3x" width="40" height="40" alt=""><span>Trend Detector</span></a>
      <nav class="nav-links" aria-label="Main">
        <a data-nav="home" href="#/home">Home</a>
        <a data-nav="trends" href="#/trends">Trends</a>
        <a data-nav="pollution" href="#/pollution">Pollution</a>
        <a data-nav="compare" href="#/compare">Compare</a>
        <a data-nav="data" href="#/data">Data</a>
        <a data-nav="about" href="#/about">About</a>
      </nav>
      <label class="switch"><input type="checkbox" id="plain-toggle"> <span>Plain<span class="wide"> language</span></span></label>
      <button class="btn" id="ask-btn" aria-controls="drawer" aria-expanded="false">Ask</button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site"><div class="wrap">
    <a href="#/data">Data &amp; method</a><a href="#/about">About</a>
    <span>Trends show what happened, not why.</span>
  </div></footer>

  <nav class="tabbar" aria-label="Main (mobile)">
    <a data-nav="home" href="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</a>
    <a data-nav="trends" href="#/trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"/></svg>Trends</a>
    <a data-nav="pollution" href="#/pollution"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h12a3 3 0 100-3M3 13h16a3 3 0 110 3M3 18h8"/></svg>Pollution</a>
    <a data-nav="compare" href="#/compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Compare</a>
  </nav>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <header><strong id="drawer-title">Ask about the data</strong><button class="btn" id="drawer-close" aria-label="Close assistant">Close</button></header>
    <div class="chat" id="chat" aria-live="polite"><div class="chat-msg chat-bot">Ask about any of the 4 variables in the 8 cities (2005–2024). Answers use only this dataset.</div></div>
    <div class="prompts">
      <button class="chip" data-prompt="Is PM2.5 increasing in Lahore?">PM2.5 in Lahore?</button>
      <button class="chip" data-prompt="Compare rainfall trends between Peshawar and Karachi">Rain: Peshawar vs Karachi</button>
      <button class="chip" data-prompt="Explain the Mann-Kendall test in plain terms">What is Mann-Kendall?</button>
    </div>
    <form class="chat-form" id="chat-form"><input type="text" id="chat-input" aria-label="Your question" placeholder="Type a question" autocomplete="off"><button class="btn btn-primary" id="chat-send" type="submit">Send</button></form>
  </aside>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
